name: Gunluk Telegram Raporu

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  rapor_gonder:
    runs-on: ubuntu-22.04
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4
      
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Kutuphaneleri Yukle
        run: pip install pandas requests supabase
          
      - name: Raporu Calistir
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python oto_rapor.py
